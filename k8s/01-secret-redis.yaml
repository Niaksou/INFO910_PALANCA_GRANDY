# Notion : Secret. Le mot de passe Redis n'apparaît dans aucun Deployment :
# il est injecté par secretKeyRef (variables d'environnement) dans redis, guerrier et arena.
# Attention : base64 n'est PAS du chiffrement, c'est juste un encodage.
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: pod-royale
  labels:
    app.kubernetes.io/part-of: pod-royale
type: Opaque
data:
  # base64 de "pod-royale-2026" (valeur par défaut pour le TP)
  #   echo -n 'pod-royale-2026' | base64
  REDIS_PASSWORD: cG9kLXJveWFsZS0yMDI2
