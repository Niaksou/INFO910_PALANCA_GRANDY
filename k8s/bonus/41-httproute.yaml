# Notion (bonus) : Gateway API, l'alternative moderne à l'Ingress vue en fin de cours.
# Le rôle « infra » (Gateway : où et comment on écoute) est séparé du rôle « appli »
# (HTTPRoute : quelles requêtes vont vers quel Service). Non appliqué par deploy.sh :
# il faut un contrôleur Gateway API installé (ex. nginx-gateway-fabric, Envoy Gateway…).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pod-royale-gw
  namespace: pod-royale
  labels:
    app.kubernetes.io/part-of: pod-royale
spec:
  # À adapter au contrôleur installé (kubectl get gatewayclass)
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: pod-royale.local
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pod-royale
  namespace: pod-royale
  labels:
    app.kubernetes.io/part-of: pod-royale
spec:
  parentRefs:
    - name: pod-royale-gw
  hostnames:
    - pod-royale.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: arena
          port: 80
